<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magizh Partner</title><style>*{box-sizing:border-box}body{margin:0;background:#f5ead8;color:#3a291f;font-family:Arial,sans-serif}main{max-width:520px;margin:auto;min-height:100vh;background:#fffdf7}.top{padding:18px 15px;background:#fff;border-bottom:1px solid #eadfce;position:sticky;top:0}.ey{font-size:9px;color:#789b58;font-weight:700;letter-spacing:1px}.top h1{font:25px Georgia;margin:5px 0}.wrap{padding:14px}.panel{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:14px;margin:10px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#fffaf1;border:1px solid #eadfce;border-radius:12px;padding:11px;text-align:center;font-size:9px}.metric b{display:block;font-size:21px;color:#536c3e}.request{background:#fff;border:1px solid #eadfce;border-radius:14px;padding:12px;margin:9px 0;font-size:10px;line-height:1.55}.btn{border:0;border-radius:20px;padding:9px 13px;font-weight:700}.ok{background:#789b58;color:#fff}.no{background:#fff;border:1px solid #c96b55;color:#a33e2d}.login{padding:35px 20px}.login input{width:100%;padding:12px;margin:6px 0;border:1px solid #d8c9b7;border-radius:10px}.login button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:22px;background:#e9792d;color:#fff;font-weight:700}.muted{color:#786b5e;font-size:9px}</style></head><body><main><div class="top"><div class="ey">MAGIZH B5 PARTNER</div><h1 id="shopName">Partner Login</h1></div><div id="app" class="wrap"></div></main><script>
const DP=[{id:'P001',name:'Magizh Cafe',town:'Namakkal',category:'Cafe',phone:'',password:'partner123',active:true},{id:'P002',name:'Annapoorani Mess',town:'Namakkal',category:'Food',phone:'',password:'partner123',active:true},{id:'P003',name:'Green Leaf Cafe',town:'Salem',category:'Cafe',phone:'',password:'partner123',active:true}];
function partners(){let x=JSON.parse(localStorage.getItem('magizhPartners')||'null');if(!Array.isArray(x)){x=DP;localStorage.setItem('magizhPartners',JSON.stringify(x))}return x}function offers(){let x=JSON.parse(localStorage.getItem('magizhPartnerOffers')||'[]');return Array.isArray(x)?x:[]}function reds(){let x=JSON.parse(localStorage.getItem('magizhRedemptions')||'[]');return Array.isArray(x)?x:[]}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function login(){document.getElementById('app').innerHTML='<div class="login"><h2>Partner Login</h2><input id="pid" placeholder="Partner ID"><input id="ppw" type="password" placeholder="Password"><button onclick="doLogin()">LOGIN</button><p class="muted">Demo partner accounts are shown in Admin → Partners & Offers.</p></div>'}function doLogin(){const p=partners().find(x=>x.id===document.getElementById('pid').value.trim()&&x.password===document.getElementById('ppw').value);if(!p){alert('Invalid Partner ID or password.');return}sessionStorage.setItem('magizhPartnerId',p.id);render()}
function render(){const id=sessionStorage.getItem('magizhPartnerId');const p=partners().find(x=>x.id===id);if(!p){login();return}document.getElementById('shopName').textContent=p.name;const rs=reds().filter(r=>r.partnerId===p.id),confirmed=rs.filter(r=>r.status==='Confirmed'),pending=rs.filter(r=>r.status==='Pending Merchant Confirmation'),coins=confirmed.reduce((n,r)=>n+Number(r.coins||0),0),bill=confirmed.reduce((n,r)=>n+Number(r.bill||0),0);document.getElementById('app').innerHTML='<div class="metrics"><div class="metric"><b>'+coins+'</b>Coins Received</div><div class="metric"><b>'+confirmed.length+'</b>Confirmed</div><div class="metric"><b>'+pending.length+'</b>Pending</div><div class="metric"><b>₹'+bill+'</b>Bill Value</div></div><div class="panel"><h3>Pending Redemption Requests</h3>'+(pending.length?pending.map(r=>'<div class="request"><b>'+esc(r.id)+'</b><br>Customer: '+esc(r.customerName||r.customerId)+'<br>Bill: ₹'+Number(r.bill||0)+'<br>Coins: 🪙 <b>'+Number(r.coins||0)+'</b><br><button class="btn ok" onclick="confirmR(\''+esc(r.id)+'\')">CONFIRM</button> <button class="btn no" onclick="rejectR(\''+esc(r.id)+'\')">REJECT</button></div>').join(''):'<div class="muted">No pending requests.</div>')+'</div><div class="panel"><h3>This Month</h3><div class="muted">Confirmed transactions: '+confirmed.length+'</div><div class="muted">Coins received: '+coins+'</div><div class="muted">Offer value / bill total: ₹'+bill+'</div></div><button class="btn no" onclick="logout()">Logout</button>'}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function confirmR(id){const a=reds(),r=a.find(x=>x.id===id);if(!r)return;r.status='Confirmed';r.confirmedAt=new Date().toISOString();save('magizhRedemptions',a);const users=JSON.parse(localStorage.getItem('magizhUsers')||'{}');if(r.customerId&&users[r.customerId]){users[r.customerId].coins=Math.max(0,Number(users[r.customerId].coins||0)-Number(r.coins||0));localStorage.setItem('magizhUsers',JSON.stringify(users));}if(sessionStorage.getItem('magizhCurrentUserId')===r.customerId)localStorage.setItem('magizhCoinWallet',String(Math.max(0,Number(localStorage.getItem('magizhCoinWallet')||0)-Number(r.coins||0))));alert('Redemption confirmed.');render()}function rejectR(id){const a=reds(),r=a.find(x=>x.id===id);if(!r)return;r.status='Rejected';r.rejectedAt=new Date().toISOString();save('magizhRedemptions',a);alert('Redemption rejected. No coins deducted.');render()}function logout(){sessionStorage.removeItem('magizhPartnerId');render()}window.addEventListener('magizhServerSync',render);render();</script><script>window.MAGIZH_SYNC_KEYS=['magizhUsers','magizhB5','magizhCoinWallet','magizhPartners','magizhPartnerOffers','magizhRedemptions'];</script><script src="server-sync.js"></script></body></html>
