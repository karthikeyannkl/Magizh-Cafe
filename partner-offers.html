<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magizh Partner Offers</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5ead8;color:#3a291f;font-family:Arial,sans-serif}main{max-width:520px;margin:auto;min-height:100vh;background:#fffdf7}.top{position:sticky;top:0;z-index:20;background:#fffdf7;border-bottom:1px solid #eadfce;padding:14px 15px}.back{display:inline-flex;text-decoration:none;color:#536c3e;border:1px solid #789b58;border-radius:20px;padding:8px 12px;font-size:11px;font-weight:700}.ey{font-size:9px;color:#e9792d;font-weight:700;letter-spacing:1.8px;display:block;margin-top:12px}.top h1{font:27px Georgia;margin:5px 0}.intro{margin:14px;background:#fff4df;border:1px solid #efd3a7;border-radius:16px;padding:14px;font-size:11px;line-height:1.5;color:#6e6156}.wrap{padding:0 14px 28px}.town{width:100%;padding:12px;border:1px solid #d8c9b7;border-radius:11px;background:#fff;font-size:13px;margin-bottom:10px}.card{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:14px;margin:10px 0}.card h2{font:20px Georgia;margin:0 0 5px}.meta{font-size:10px;color:#786b5e;line-height:1.5}.badge{display:inline-block;background:#e9f1df;color:#536c3e;border-radius:15px;padding:6px 9px;font-size:10px;font-weight:700;margin:8px 0}.use{width:100%;padding:12px;border:0;border-radius:22px;background:#e9792d;color:#fff;font-weight:700;margin-top:9px}.empty{text-align:center;padding:24px;color:#786b5e;font-size:11px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:#fffdf7;border-radius:22px 22px 0 0;padding:20px 17px 28px}.close{float:right;border:0;background:none;font-size:24px}.sheet input{width:100%;padding:12px;border:1px solid #d8c9b7;border-radius:10px}.notice{background:#e9f1df;border-radius:12px;padding:11px;margin:10px 0;font-size:10px;line-height:1.5;color:#536c3e}.confirm{width:100%;padding:12px;border:0;border-radius:22px;background:#789b58;color:#fff;font-weight:700;margin-top:8px}</style></head><body><main><div class="top"><a class="back" href="/">← Back to Magizh Cafe</a><span class="ey">B5 COIN BENEFIT</span><h1>Partner Shop Offers</h1></div><div class="intro">Use your B5 Coins at selected partner shops and cafes. Select your town, choose an active offer and submit your bill. Coins are deducted only after the merchant confirms.</div><div class="wrap"><select id="town" class="town" onchange="renderOffers()"></select><div id="list"></div></div></main><div id="redeem" class="modal"><div class="sheet"><button class="close" onclick="closeRedeem()">×</button><span class="ey" style="margin-top:0">REDEEM OFFER</span><h2 id="title"></h2><div class="notice">🪙 Your B5 Balance: <b><span id="bal">0</span> Coins</b></div><label style="font-size:10px;color:#6e6156">Bill Amount (₹)</label><input id="bill" type="number" min="1" inputmode="decimal" placeholder="Enter bill amount" oninput="calc()"><div id="calc" class="notice">Enter your bill amount.</div><button class="confirm" onclick="requestRedeem()">Request Redemption →</button></div></div>
<script>
const DP=[{id:'P001',name:'Magizh Cafe',town:'Namakkal',category:'Cafe',phone:'',active:true},{id:'P002',name:'Annapoorani Mess',town:'Namakkal',category:'Food',phone:'',active:true},{id:'P003',name:'Green Leaf Cafe',town:'Salem',category:'Cafe',phone:'',active:true}];
const DO=[{id:'O001',partnerId:'P001',title:'Gandhi Jayanti Special',percent:20,start:'2026-10-02',end:'2026-10-02',minBill:100,maxCoins:200,active:true},{id:'O002',partnerId:'P002',title:'Everyday B5 Offer',percent:30,start:'2026-10-01',end:'2026-12-31',minBill:100,maxCoins:300,active:true},{id:'O003',partnerId:'P003',title:'Weekend Special',percent:20,start:'2026-10-01',end:'2026-12-31',minBill:100,maxCoins:200,active:true}];
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function get(k,d){try{let x=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(x))return x}catch(e){} localStorage.setItem(k,JSON.stringify(d));return d}
function ps(){return get('magizhPartners',DP).filter(p=>p.active!==false)} function os(){return get('magizhPartnerOffers',DO).filter(o=>o.active!==false)}
function wallet(){let u=null;try{u=JSON.parse(sessionStorage.getItem('magizhCurrentUser')||'null')}catch(e){} return Number(u?.coins ?? localStorage.getItem('magizhCoinWallet') ?? 0)}
function init(){const towns=[...new Set(ps().map(p=>p.town))];document.getElementById('town').innerHTML=towns.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');renderOffers()}
let selected=null;
function renderOffers(){const town=document.getElementById('town').value;const partners=ps().filter(p=>p.town===town);const offers=os();const list=[];partners.forEach(p=>offers.filter(o=>o.partnerId===p.id).forEach(o=>list.push({p,o})));document.getElementById('list').innerHTML=list.length?list.map(x=>`<div class="card">${x.p.image?`<img src="${esc(x.p.image)}" alt="${esc(x.p.name)} offer" style="width:100%;height:155px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}<h2>${esc(x.p.name)}</h2><div class="meta">📍 ${esc(x.p.town)} • ${esc(x.p.category)}</div><span class="badge">🪙 ${Number(x.o.percent)||0}% COINS</span><div class="meta"><b>${esc(x.o.title)}</b><br>Minimum bill ₹${Number(x.o.minBill)||0}${Number(x.o.maxCoins)>0?' • Maximum '+Number(x.o.maxCoins)+' coins':''}<br>Valid: ${esc(x.o.start)} to ${esc(x.o.end)}</div><button class="use" onclick="start('${esc(x.o.id)}')">Use This Offer</button></div>`).join(''):'<div class="empty">No active partner offers in this town.</div>'}
function start(id){const o=os().find(x=>x.id===id),p=ps().find(x=>x.id===o?.partnerId);if(!o||!p)return;selected={o,p};document.getElementById('title').textContent=p.name+' — '+o.title;document.getElementById('bal').textContent=wallet();document.getElementById('bill').value='';document.getElementById('calc').innerHTML='Enter your bill amount.';document.getElementById('redeem').style.display='flex'}
function closeRedeem(){document.getElementById('redeem').style.display='none';selected=null}
function calc(){if(!selected)return;const bill=Math.max(0,Number(document.getElementById('bill').value)||0),o=selected.o;let c=Math.floor(bill*(Number(o.percent)||0)/100);if(o.maxCoins>0)c=Math.min(c,Number(o.maxCoins));c=Math.min(c,wallet());document.getElementById('calc').innerHTML=`Bill: <b>₹${bill}</b><br>Offer: <b>${Number(o.percent)||0}%</b><br>Coins requested: <b>🪙 ${c}</b>`}
function requestRedeem(){if(!selected)return;const bill=Math.max(0,Number(document.getElementById('bill').value)||0),o=selected.o;if(bill<Number(o.minBill||0)){alert('Minimum bill is ₹'+Number(o.minBill||0));return}let c=Math.floor(bill*(Number(o.percent)||0)/100);if(o.maxCoins>0)c=Math.min(c,Number(o.maxCoins));c=Math.min(c,wallet());if(c<=0){alert('Not enough B5 coins.');return}let a=get('magizhRedemptions',[]),u=null;try{u=JSON.parse(sessionStorage.getItem('magizhCurrentUser')||'null')}catch(e){}const id='R-'+Date.now().toString(36).toUpperCase();a.push({id,offerId:o.id,partnerId:selected.p.id,customerId:sessionStorage.getItem('magizhCurrentUserId')||'GUEST',customerName:u?.name||'Customer',bill,coins:c,status:'Pending Merchant Confirmation',date:new Date().toISOString()});localStorage.setItem('magizhRedemptions',JSON.stringify(a));closeRedeem();alert('Redemption request sent to '+selected.p.name+'. Coins will be deducted after merchant confirmation.\n\nRedemption ID: '+id)}
init();
</script><script>window.MAGIZH_SYNC_KEYS=['magizhPartners','magizhPartnerOffers','magizhRedemptions','magizhPartnerSlides','magizhB5','magizhCoinWallet'];</script><script src="/server-sync.js"></script></body></html>
