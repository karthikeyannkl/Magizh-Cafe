<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B5 Coins Partner Offers | Magizh Cafe</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf5eb;color:#3a291f;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#fffdf8}.top{display:flex;align-items:center;gap:12px;padding:17px;background:#3a291f;color:#fff}.back{border:0;background:transparent;color:#fff;font-size:25px;padding:0 5px}.top h1{font:25px Georgia;margin:0}.searchbox{padding:14px 14px 8px}.searchbox input{width:100%;padding:12px;border:1px solid #dfcfb8;border-radius:12px;background:white;font-size:14px}.location{padding:4px 15px 12px;font-size:12px;color:#6e6156}.filters{display:flex;gap:7px;overflow:auto;padding:0 14px 14px}.filters button{white-space:nowrap;border:1px solid #d8c9b7;background:#fff;border-radius:20px;padding:9px 14px;font-size:11px;color:#3a291f}.filters button.active{background:#789b58;color:white;border-color:#789b58}.heading{padding:0 15px 12px}.heading small{color:#e9792d;letter-spacing:2px;font-size:9px;font-weight:bold}.heading h2{font:28px Georgia;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 22px}.card{background:white;border:1px solid #eadfce;border-radius:16px;overflow:hidden}.photo{height:132px;background:linear-gradient(145deg,#e9f1df,#f8dfb7);display:grid;place-items:center;font-size:48px;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.percent{position:absolute;right:7px;top:7px;background:#df653e;color:white;padding:7px 9px;border-radius:10px;font-weight:bold;font-size:12px}.body{padding:11px}.body h3{font:18px Georgia;margin:0 0 5px}.type{font-size:9px;color:#789b58}.coins{font-size:11px;color:#b66c26;font-weight:bold;margin:9px 0 5px}.meta{font-size:9px;color:#786b5e;line-height:1.6}.view{margin-top:10px;width:100%;border:0;border-radius:20px;padding:10px;background:#789b58;color:#fff;font-size:10px;font-weight:bold}.empty{margin:10px 14px;padding:28px 15px;text-align:center;border:1px dashed #d8c9b7;border-radius:14px;color:#786b5e;font-size:12px;grid-column:1/-1}.note{margin:0 14px 18px;background:#f7ecd9;padding:12px;border-radius:12px;font-size:10px;color:#786b5e;line-height:1.5}@media(max-width:360px){.grid{gap:8px;padding:0 8px 18px}.photo{height:105px}.body{padding:8px}.body h3{font-size:15px}}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><header class="top"><button class="back" onclick="location.href='/'" aria-label="Back">‹</button><h1>Partner Offers</h1></header><div class="searchbox"><input id="search" placeholder="Search partner shops..." oninput="draw()"></div><div class="location">📍 <span id="city">Namakkal</span></div><nav class="filters" id="filters"></nav><div class="heading"><small>B5 COINS</small><h2>Partner Offers</h2></div><div class="grid" id="cards"></div><div class="note">Offer conditions, minimum bill and maximum coin usage are set by each partner. Confirm the final bill with the shop before redeeming coins.</div></main><script>const categories=['All','Food','Cafes','Shops','Salons','Others'];let selected='All';function offers(){try{return JSON.parse(localStorage.getItem('magizhPartnerOffers')||'[]').filter(x=>x&&x.active!==false)}catch(e){return []}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(c){c=String(c||'').toLowerCase();if(c.includes('cafe'))return 'Cafes';if(c.includes('food')||c.includes('restaurant')||c.includes('mess'))return 'Food';if(c.includes('salon'))return 'Salons';if(c.includes('shop')||c.includes('fashion'))return 'Shops';return 'Others'}function draw(){const a=offers();const q=document.getElementById('search').value.trim().toLowerCase();const list=a.filter(x=>(selected==='All'||norm(x.category)===selected)&&(!q||String(x.name+' '+x.category+' '+x.city).toLowerCase().includes(q)));document.getElementById('filters').innerHTML=categories.map(c=>`<button class="${selected===c?'active':''}" onclick="selected='${c}';draw()">${c}</button>`).join('');document.getElementById('city').textContent=a.find(x=>x.city)?.city||'Namakkal';document.getElementById('cards').innerHTML=list.length?list.map(x=>`<article class="card"><div class="photo">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:'🏪'}<span class="percent">${Number(x.percent)||0}%</span></div><div class="body"><h3>${esc(x.name)}</h3><div class="type">${esc(x.category||'Partner')} · ${esc(x.city||'Namakkal')}</div><div class="coins">${Number(x.percent)||0}% B5 Coins</div><div class="meta">Min Bill ₹${Number(x.minBill)||0}<br>Max ${Number(x.maxCoins)||0} Coins</div><button class="view" onclick="alert('Please show this offer to the partner shop and confirm eligibility before using coins.')">View Offer →</button></div></article>`).join(''):'<div class="empty">No partner offers yet.<br><br>Once a partner is added from Admin → Partner Offers, it will appear here.</div>'}draw();</script></body></html>
